name: Embedded C CI & Static Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Build Tools & cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make cppcheck

    - name: Run cppcheck Static Analysis (MISRA Guidelines)
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem --error-exitcode=1 \
          -I firmware/hal -I firmware/core_gfx -I firmware/services -I firmware/app \
          firmware/core_gfx/ firmware/services/ firmware/app/

    - name: Build & Run Unity Test Suite
      run: |
        make test

    - name: Build Interactive PC Simulator
      run: |
        make sim
